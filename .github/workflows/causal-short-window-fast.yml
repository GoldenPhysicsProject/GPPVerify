name: Causal Short Window Fast

on:
  pull_request:
    paths:
      - 'GppVerify/RiemannHypothesis/CausalShortWindowShift.lean'
      - '.github/workflows/causal-short-window-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-causal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-
      - name: Restore mathlib cache
        run: lake exe cache get
      - name: Compile two/three-layer bounds
        run: lake build GppVerify.RiemannHypothesis.CausalShortWindowShift
      - name: No sorry or axiom declarations
        run: |
          if grep -nE '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' GppVerify/RiemannHypothesis/CausalShortWindowShift.lean; then
            exit 1
          fi
