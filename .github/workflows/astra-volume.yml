name: Astra volume constraint proof
on:
  push:
    branches: ["astra/volume-constraint-repair"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain manager
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Compile volume constraint core and print dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake build GppVerify.QuantumGravity.CausalDiamondFisherCancellation GppVerify.QuantumGravity.CausalDiamondGammaBridge
          lake env lean GppVerify/GeneralRelativity/VolumeConstraintEntanglement.lean 2>&1 | tee /tmp/astra-proof.log
          if grep -F "sorryAx" /tmp/astra-proof.log; then exit 1; fi
      - name: Source and root-import gates
        run: |
          python scripts/check_sorries.py
          python scripts/check_import_graph.py
