name: Prime Gram Fast Lane

on:
  pull_request:
    paths:
      - 'GppVerify/RiemannHypothesis/PrimeThresholdFullGram.lean'
      - 'GppVerify/RiemannHypothesis/PrimeThresholdSourceCovariance.lean'
      - '.github/workflows/prime-gram-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prime-gram:
    name: targeted prime Gram Lean check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}
      - name: Cache Lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Build exact Gram module and imports
        run: lake build GppVerify.RiemannHypothesis.PrimeThresholdFullGram
      - name: Reject sorry/axiom in new source
        run: |
          if grep -nE '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' GppVerify/RiemannHypothesis/PrimeThresholdFullGram.lean; then
            echo '::error::Unproved or axiom-backed source in prime Gram module'
            exit 1
          fi
