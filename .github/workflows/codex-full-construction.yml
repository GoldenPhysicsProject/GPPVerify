name: Codex full construction

on:
  push:
    branches: ["main", "codex/lean-workbench"]
  pull_request:
    branches: ["main", "codex/lean-workbench"]

concurrency:
  group: full-construction-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: ${{ runner.os }}-elan-${{ hashFiles('lean-toolchain') }}
      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: ${{ runner.os }}-lake-${{ hashFiles('lake-manifest.json') }}
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Build every Verify2 library module
        run: lake build
      - name: Build import-connected construction
        run: lake build GppVerify.FullConstruction
      - name: Audit root and full-construction import coverage
        run: python3 scripts/audit_root_imports.py
