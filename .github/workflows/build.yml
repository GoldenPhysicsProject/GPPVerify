name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install elan
        run: |
          curl -sSfL \
            https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}

      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-

      - name: Get Mathlib cache
        run: lake exe cache get || true

      - name: Build
        run: set -o pipefail && lake build 2>&1 | tee /tmp/build.log

      - name: Compile every changed Lean module
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --quiet
          mapfile -t FILES < <(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- 'GppVerify/**/*.lean')
          if ((${#FILES[@]} == 0)); then
            echo 'No changed Lean modules outside the root build.'
            exit 0
          fi
          printf 'Changed Lean modules to compile explicitly:\n%s\n' "${FILES[*]}"
          for file in "${FILES[@]}"; do
            [[ -f "$file" ]] || continue
            module="${file%.lean}"
            module="${module//\//.}"
            echo "=== $module ==="
            lake build "$module"
          done

      - name: Import-graph gate (FAILS the build)
        # Runs BEFORE the sorry gates on purpose. `lake build GppVerify` only compiles what
        # the root module transitively imports, so a file outside that graph is never built
        # — it can be broken, carry a `sorry`, or declare an axiom while CI reports green.
        # 15 of 185 modules were in exactly that state until 2026-09-01, including through
        # the 4.33.1 upgrade. Hole found by Codex on its own port and relayed via the bridge.
        run: python3 scripts/check_import_graph.py

      - name: Sorry gate, source-level (FAILS the build)
        # Runs FIRST of the two sorry checks, and is the one that must not be removed:
        # it reads the tree, so no cache state can hide anything from it.
        run: python3 scripts/check_sorries.py

      - name: Sorry gate, build-log (FAILS the build)
        run: |
          echo "=== Sorry gate (build log) ==="
          # Gate on Lean's OWN diagnostic as well as on the source, because this one
          # catches sorries introduced by a *tactic* rather than by the literal token,
          # which `check_sorries.py` cannot see.
          #
          # This check alone is NOT sufficient, and the comment that used to stand here
          # said otherwise: it claimed "lake replays warnings for cached modules, so this
          # is reliable on a fully-cached build". That is false — a module replayed from
          # cache emits no diagnostic at all. A `sorry` in hasDerivAt_sechFourthAntideriv
          # rode into main through PR #133 ("the whole tree builds clean") and survived
          # four further merges and several "0 sorries" status reports, because every one
          # of those CI runs was cached and this gate printed OK each time.
          #
          # Keep both. Neither covers the other's blind spot.
          if grep -F "declaration uses 'sorry'" /tmp/build.log; then
            echo "::error::A declaration uses 'sorry'. Standing rule: no sorry ever committed."
            exit 1
          fi
          echo "OK — no declaration uses 'sorry' in this run's build output."

      - name: Axiom audit
        run: |
          echo "=== Axiom audit ==="
          # No `--run`: the script has no `main`, so `--run` exits nonzero on
          # "unknown declaration 'main'" even when the audit succeeded.
          # Any `sorryAx` in this output means a flagship theorem rests on a sorry.
          lake env lean scripts/check_axioms.lean | tee /tmp/axioms.log
          if grep -F "sorryAx" /tmp/axioms.log; then
            echo "::error::A flagship theorem depends on sorryAx."
            exit 1
          fi

      - name: Stub census (informational — does NOT fail)
        run: |
          echo "=== Open-result stubs: theorem _ : True := trivial ==="
          # These are the honest parking convention for open results, NOT proofs.
          # Invisible to both the sorry gate and the axiom audit, so surface them
          # in every run to keep the drift visible.
          TOTAL=$(grep -rn ": True := trivial" GppVerify/ --include="*.lean" | wc -l)
          echo "Total stubs: $TOTAL"
          echo "--- per file ---"
          grep -rc ": True := trivial" GppVerify/ --include="*.lean" \
            | grep -v ':0$' | sort -t: -k2 -rn
          echo
          echo "NOTE: a file can report 0 sorries and 0 axioms and still be mostly stubs."
          echo "Quote all three numbers (sorry / axiom / stub) in any status claim."

      - name: Stub naming gate (FAILS the build)
        run: python3 scripts/check_stub_naming.py

      - name: Blueprint reference gate (FAILS the build)
        run: python3 scripts/check_blueprint_refs.py

      - name: Landing-page claim gate (FAILS the build)
        run: python3 scripts/check_landing_claims.py
