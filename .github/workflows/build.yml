name: Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: lake build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL \
            https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}

      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-

      - name: Get Mathlib cache
        run: lake exe cache get || true

      - name: Build
        run: lake build

      - name: Axiom audit
        run: |
          echo "=== Axiom audit ==="
          lake env lean --run scripts/check_axioms.lean 2>&1 || \
            echo "(check_axioms.lean not yet written — skipping)"

      - name: Sorry count
        run: |
          echo "=== Sorry count ==="
          grep -rn "sorry" GppVerify/ --include="*.lean" | grep -v "^.*--.*sorry" | wc -l || true
          grep -rn "sorry" GppVerify/ --include="*.lean" | grep -v "^.*--.*sorry" || true
