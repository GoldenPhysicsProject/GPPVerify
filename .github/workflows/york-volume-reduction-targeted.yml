name: York reduction targeted Lean
on:
  pull_request:
    branches: ["main"]
    paths:
      - 'GppVerify/GeneralRelativity/YorkVolumeReduction.lean'
      - 'GppVerify/GeneralRelativity/YorkVolumeContinuum.lean'
      - 'GppVerify/GeneralRelativity/DiamondRadiusModularNoGo.lean'
      - 'GppVerify/GeneralRelativity/TimeReversalEntropyGravity.lean'
      - 'GppVerify/GeneralRelativity/OrientationYorkMomentMap.lean'
      - 'GppVerify/QuantumGravity/OrientationObservableObstruction.lean'
      - 'GppVerify/GeneralRelativity/YorkClockConstraintCountermodel.lean'
      - 'GppVerify/GeneralRelativity/DiamondADMHessianYork.lean'
      - 'GppVerify/GeneralRelativity/DiamondBoundaryChargeObstruction.lean'
      - 'GppVerify/GeneralRelativity/DiamondExplicitBoundaryCancellation.lean'
      - 'GppVerify/GeneralRelativity/DiamondHaarNormalMoment.lean'
      - 'GppVerify/GeneralRelativity/DiamondFlatFirstLawFromGreen.lean'
      - 'GppVerify/GeneralRelativity/DiamondLapseMomentRecovery.lean'
      - 'GppVerify/GeneralRelativity/DiamondObserverTomography.lean'
      - 'GppVerify/GeneralRelativity/DoubledYorkOrientation.lean'
      - '.github/workflows/york-volume-reduction-targeted.yml'
  workflow_dispatch:
jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}
      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-
      - name: Get Mathlib cache
        run: lake exe cache get || true
      - name: Lean check new reduction theorem and dependencies
        run: |
          set -o pipefail
          lake build GppVerify.GeneralRelativity.YorkVolumeReduction GppVerify.GeneralRelativity.YorkVolumeContinuum GppVerify.GeneralRelativity.DiamondRadiusModularNoGo GppVerify.GeneralRelativity.TimeReversalEntropyGravity GppVerify.GeneralRelativity.OrientationYorkMomentMap GppVerify.QuantumGravity.OrientationObservableObstruction GppVerify.GeneralRelativity.YorkClockConstraintCountermodel GppVerify.GeneralRelativity.DiamondADMHessianYork GppVerify.GeneralRelativity.DiamondBoundaryChargeObstruction GppVerify.GeneralRelativity.DiamondExplicitBoundaryCancellation GppVerify.GeneralRelativity.DiamondHaarNormalMoment GppVerify.GeneralRelativity.DiamondFlatFirstLawFromGreen GppVerify.GeneralRelativity.DiamondLapseMomentRecovery GppVerify.GeneralRelativity.DiamondObserverTomography GppVerify.GeneralRelativity.DoubledYorkOrientation 2>&1 | tee /tmp/york_reduction.log
      - name: Sorry check
        run: |
          ! grep -F "declaration uses 'sorry'" /tmp/york_reduction.log
          python3 scripts/check_sorries.py
