name: PR Fast Verify 236
on:
  push:
    branches: ["codex/passive-network-lemmas"]
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}
      - uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-
      - run: lake exe cache get || true
      - name: Build target
        run: lake build GppVerify.RiemannHypothesis.PassiveNetworkKron 2>&1 | tee /tmp/fast.log
      - name: Sorry gate
        run: |
          if grep -F "declaration uses 'sorry'" /tmp/fast.log; then exit 1; fi
