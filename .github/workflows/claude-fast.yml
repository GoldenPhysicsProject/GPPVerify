name: Claude Fast Lane

# Targeted gate for the front currently in flight, mirroring the dedicated-lane pattern
# GPPVerify2 uses (codex-fast.yml, codex-sech-closed.yml, ...). The full `Build` workflow
# rebuilds ~3,400 modules and takes ~8 minutes; this builds only the modules named below
# and returns in ~2. It is an ITERATION aid, not a replacement: `Build` (with its sorry
# gate and axiom audit) is still the merge gate, and still has to be green.
#
# Edit MODULES when the active front changes -- the current front and its target files
# live in Supabase `public.claude_fronts` (see website/GPPVERIFY.md, "Work rotation").

on:
  push:
    branches: ["claude/**"]
  workflow_dispatch:

jobs:
  fast:
    name: targeted build
    runs-on: ubuntu-latest

    env:
      # Codex RH closure front
      MODULES: >-
        GppVerify.ThreadWeilParity.RadicalBoundaryReduction
        GppVerify.ThreadWeilParity.HodgeIndexBoundary
        GppVerify.RiemannHypothesis.BPYQuadraticBulk
        GppVerify.RiemannHypothesis.HilbertQuotientClosure
        GppVerify.RiemannHypothesis.KreinGraphClosure
        GppVerify.RiemannHypothesis.PrimeOccupationHodge

    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL \
            https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}

      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-

      - name: Get Mathlib cache
        run: lake exe cache get || true

      - name: Build front modules
        run: set -o pipefail && lake build $MODULES 2>&1 | tee /tmp/fast.log

      - name: Unused-hypothesis gate (front modules)
        run: |
          FRONT_RE='GppVerify/(ThreadWeilParity/(RadicalBoundaryReduction|HodgeIndexBoundary)|RiemannHypothesis/(BPYQuadraticBulk|HilbertQuotientClosure|KreinGraphClosure|PrimeOccupationHodge))\.lean.*is not explicitly referenced'
          if grep -E "$FRONT_RE" /tmp/fast.log; then
            echo "::error::Unused binder(s) in RH closure front."
            exit 1
          fi
          echo "No unused binders in RH closure front (dependency warnings ignored here; full-tree gate remains separate)."

      - name: Sorry gate (front modules)
        run: |
          if grep -F "declaration uses 'sorry'" /tmp/fast.log; then
            echo "::error::A declaration uses 'sorry'. Standing rule: no sorry ever committed."
            exit 1
          fi
          echo "No sorry in front modules."

      - name: Source and honesty gates
        run: |
          python3 scripts/check_import_graph.py
          python3 scripts/check_sorries.py
          python3 scripts/check_stub_naming.py
          python3 scripts/check_vacuity.py
          python3 scripts/check_blueprint_refs.py
          python3 scripts/check_landing_claims.py

      - name: Flagship axiom audit
        run: |
          lake env lean scripts/check_axioms.lean | tee /tmp/axioms.log
          if grep -F "sorryAx" /tmp/axioms.log; then
            echo "::error::A flagship theorem depends on sorryAx."
            exit 1
          fi
