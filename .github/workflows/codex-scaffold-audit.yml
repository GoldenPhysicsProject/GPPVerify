name: Codex axiom and scaffold audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [codex/lean-workbench]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run ranked axiom/scaffold census
        run: python3 scripts/audit_scaffolds.py

      - name: Write machine-readable census
        run: python3 scripts/audit_scaffolds.py --json > scaffold-audit.json

      - name: Upload census artifact
        uses: actions/upload-artifact@v4
        with:
          name: scaffold-audit
          path: scaffold-audit.json
          if-no-files-found: error
