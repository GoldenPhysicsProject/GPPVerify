name: Codex sech convolution closed form

on:
  push:
    branches: ["codex/lean-workbench"]
  workflow_dispatch:

concurrency:
  group: codex-sech-closed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sech-closed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: lean-toolchain-${{ hashFiles('lean-toolchain') }}
      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-${{ runner.os }}
          restore-keys: |
            lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}-
      - name: Get Mathlib cache
        run: lake exe cache get || true
      - name: Exact nonzero sech convolution
        run: lake build GppVerify.CelestialHolography.SechConvolutionClosedForm
      - name: Wiener-Hopf removable extension
        run: lake build GppVerify.CelestialHolography.WienerHopfWeightExtension
