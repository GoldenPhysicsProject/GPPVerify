name: Blueprint

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-blueprint:
    name: Build blueprint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz libgraphviz-dev python3-pip \
            texlive-latex-extra texlive-fonts-extra latexmk

      - name: Install leanblueprint
        run: pip3 install leanblueprint

      - name: Build blueprint
        run: leanblueprint web

      - name: Fix mobile layout
        run: |
          WEBDIR="blueprint/src/web"

          # Write mobile CSS override
          cat > "$WEBDIR/styles/mobile-fix.css" << 'CSSEOF'
/* Mobile fix: show content on small screens */
@media (max-width: 1023px) {
  div.wrapper {
    flex-direction: column;
  }
  div.content {
    display: flex !important;
    overflow: auto;
  }
  nav.toc {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 85vw;
    height: 100vh;
    z-index: 100;
    background: #fff;
    box-shadow: 2px 0 8px rgba(0,0,0,0.2);
    overflow-y: auto;
    padding: 1rem;
  }
  nav.toc.active {
    display: flex !important;
  }
  body > header {
    position: sticky;
    top: 0;
    z-index: 50;
    padding: 0.75rem 1rem;
  }
  svg#toc-toggle {
    width: 1.5rem;
    height: 1.5rem;
    cursor: pointer;
  }
}
CSSEOF

          # Inject the mobile CSS link into every HTML file
          for f in "$WEBDIR"/*.html; do
            sed -i "s|</head>|<link rel=\"stylesheet\" href=\"styles/mobile-fix.css\" />\n<script>document.addEventListener(\"DOMContentLoaded\",function(){var t=document.getElementById(\"toc-toggle\"),n=document.querySelector(\"nav.toc\");if(t&&n){t.addEventListener(\"click\",function(){n.classList.toggle(\"active\");});}});</script>\n</head>|" "$f"
          done

      - name: Write CNAME
        run: echo "lean.goldenphysics.org" > blueprint/src/web/CNAME

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/src/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build-blueprint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
