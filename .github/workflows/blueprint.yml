name: Blueprint

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-blueprint:
    name: Build blueprint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y graphviz libgraphviz-dev python3-pip \
            texlive-latex-extra texlive-fonts-extra latexmk

      - name: Install leanblueprint
        run: pip3 install leanblueprint

      - name: Build blueprint
        run: leanblueprint web

      - name: Fix mobile and write CNAME
        run: |
          WEBDIR="blueprint/src/web"
          cp blueprint/mobile-fix.css "$WEBDIR/styles/mobile-fix.css"
          python3 - << 'PYEOF'
import os, glob
webdir = "blueprint/src/web"
inject = '<link rel="stylesheet" href="styles/mobile-fix.css" />\n<script>document.addEventListener("DOMContentLoaded",function(){var t=document.getElementById("toc-toggle"),n=document.querySelector("nav.toc");if(t&&n){t.addEventListener("click",function(){n.classList.toggle("active");});}});</script>\n'
for path in glob.glob(os.path.join(webdir, "*.html")):
    with open(path, "r") as f:
        html = f.read()
    if "mobile-fix.css" not in html:
        html = html.replace("</head>", inject + "</head>", 1)
        with open(path, "w") as f:
            f.write(html)
print(f"Patched {len(glob.glob(os.path.join(webdir, '*.html')))} HTML files")
PYEOF
          echo "lean.goldenphysics.org" > "$WEBDIR/CNAME"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: blueprint/src/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build-blueprint
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
