name: Codex Gibbs differential thermodynamics

on:
  push:
    branches:
      - codex/lean-workbench
  pull_request:
    branches:
      - main

concurrency:
  group: codex-gibbs-differential-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Zeta Gibbs second-to-third cumulant derivative
        run: lake build GppVerify.RiemannHypothesis.ZetaGibbsCumulantDerivative
      - name: Zeta Gibbs fourth cumulant
        run: lake build GppVerify.RiemannHypothesis.ZetaGibbsFourthCumulant
      - name: Abstract cumulant differential algebra
        run: lake build GppVerify.RiemannHypothesis.GibbsCumulantDifferentialAlgebra
      - name: Full zeta cumulant hierarchy
        run: lake build GppVerify.RiemannHypothesis.ZetaGibbsCumulantHierarchy
      - name: Strict zeta Gibbs variance curvature
        run: lake build GppVerify.RiemannHypothesis.ZetaGibbsVarianceCurvature
      - name: Quartic von Mangoldt positivity
        run: lake build GppVerify.RiemannHypothesis.VonMangoldtQuarticPositivity
      - name: Strict third Gibbs cumulant derivative
        run: lake build GppVerify.RiemannHypothesis.ZetaGibbsThirdCumulantDerivative
      - name: Zeta Gibbs heat capacity derivative
        run: lake build GppVerify.RiemannHypothesis.ZetaGibbsHeatCapacityDerivative
      - name: Zeta Gibbs differential entropy law
        run: lake build GppVerify.RiemannHypothesis.ZetaGibbsEntropyDerivative
      - name: Zeta Gibbs differential Legendre law
        run: lake build GppVerify.RiemannHypothesis.ZetaGibbsLegendreDifferential
      - name: Zeta Gibbs free-energy curvature
        run: lake build GppVerify.RiemannHypothesis.ZetaGibbsFreeEnergyCurvature
      - name: Zeta Gibbs critical pole regularization
        run: lake build GppVerify.RiemannHypothesis.ZetaGibbsCriticalRegularization
      - name: Generic critical-pole differential algebra
        run: lake build GppVerify.RiemannHypothesis.CriticalPoleDifferentialAlgebra
