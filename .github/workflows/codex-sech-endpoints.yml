name: Codex sech convolution endpoints

on:
  push:
    branches: ["codex/lean-workbench"]
  pull_request:
    branches: ["main", "codex/lean-workbench"]

concurrency:
  group: codex-sech-endpoints-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Cache Lean toolchain
        uses: actions/cache@v4
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}
      - name: Cache lake packages
        uses: actions/cache@v4
        with:
          path: .lake/packages
          key: lake-${{ runner.os }}-${{ hashFiles('lake-manifest.json') }}
      - name: Get Mathlib cache
        run: lake exe cache get
      - name: Sech convolution endpoint limits
        run: lake build GppVerify.CelestialHolography.SechConvolutionEndpoints
      - name: Exact nonzero sech convolution closed form
        run: lake build GppVerify.CelestialHolography.SechConvolutionClosedForm
      - name: Wiener-Hopf normalization of sech convolution
        run: lake build GppVerify.CelestialHolography.SechConvolutionWienerHopf
      - name: Positive Wiener-Hopf square-root factor
        run: lake build GppVerify.CelestialHolography.WienerHopfPositiveFactor
      - name: Wiener-Hopf Gamma base bridge
        run: lake build GppVerify.CelestialHolography.WienerHopfGammaBridge
      - name: Positive factor of base Gamma spectral density
        run: lake build GppVerify.CelestialHolography.WienerHopfGammaPositiveFactor
      - name: Wiener-Hopf Gamma full chamber hierarchy
        run: lake build GppVerify.CelestialHolography.WienerHopfGammaChamberHierarchy
      - name: Positive factorization of every Gamma chamber
        run: lake build GppVerify.CelestialHolography.WienerHopfGammaChamberPositiveFactor
      - name: Zero-shift and all-real sech convolution normalization
        run: set -o pipefail && lake build GppVerify.CelestialHolography.SechConvolutionZeroShift 2>&1 | tee /tmp/sech-zero.log
      - name: Upload zero-shift diagnostic
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: sech-zero-diagnostic
          path: /tmp/sech-zero.log
          if-no-files-found: error
